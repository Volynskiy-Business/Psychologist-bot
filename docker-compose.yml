
services:
  bot:
    build: .
    container_name: psy-support-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override host-based DATABASE_URL from .env with Docker-network address
      DATABASE_URL: postgresql+asyncpg://psysupport_user:K9d8r7m6b5L4v3x2Z1c0n9M8@postgres:5432/psysupport
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./alembic.ini:/app/alembic.ini
      - ./alembic:/app/alembic
    ports:
      - "8000:8000"  # Prometheus metrics
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: psysupport-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: psysupport_user
      POSTGRES_PASSWORD: K9d8r7m6b5L4v3x2Z1c0n9M8
      POSTGRES_DB: psysupport
    ports:
      - "5433:5432"
    volumes:
      - psysupport_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psysupport_user -d psysupport"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: psy-support-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: psy-support-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    container_name: psy-support-grafana
    restart: unless-stopped
    profiles:
      - monitoring
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  psysupport_postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

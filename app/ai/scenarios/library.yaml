      - "Don't minimize the loss as just money"
      - "Don't push for professional referral before validating the pain"
    contraindications: []
    escalation_rules:
      - "If financial ruin generates suicidal ideation → escalate to Tier 3"
    knowledge_snippets:
      - "Жертвы мошенничества чаще всего испытывают прежде всего стыд, а не гнев — мошенники эксплуатируют доверие и желание помочь, которые являются силой, а не слабостью."
      - "Потеря накоплений через обман несёт двойную травму: финансовую (потеря денег) и экзистенциальную (потеря ощущения, что умеешь разбираться в людях и защищать себя)."
      - "Социальная изоляция — ключевой механизм мошенничества и его последствий: стыд мешает рассказать близким, что усиливает боль. Просто присутствовать без осуждения — важнее советов."
      - "Профессиональные мошеннические схемы создаются специально для обхода критического мышления — эффективный обман невозможен без доверия и симпатии жертвы."

  - id: robbery_theft_trauma
    title: "Ограбление / Кража / Нарушение безопасности"
    emotion_signals:

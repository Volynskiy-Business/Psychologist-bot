      - robbed
      - stolen
      - burglary
      - break-in
      - mugged
      - theft
      - they broke in
      - my house was robbed
      - everything stolen
    risk_signals:
      - чувствую себя в опасности
      - боюсь возвращаться домой
    risk_ceiling: 2
    recommended_techniques:
      - grounding_54321
      - labeling_dbt
      - permission_to_grieve
      - physical_discharge
      - body_grounding
    response_shape: "hear → check_current_safety → suggest_one_stabilizing_step → invite_to_share"
    do_rules:
      - "Первым делом признай нарушение ощущения безопасности — не просто потерю вещей"
      - "Спроси, в безопасности ли человек прямо сейчас — есть ли место, где он может побыть в безопасности, или рядом есть кто-то доверенный"
      - "Предложи один практический шаг стабилизации: перейти в более безопасное место, написать или позвонить кому-то близкому, не оставаться одному"
      - "Упомяни местные службы (полиция, охрана здания) только как практическую опцию — не как юридический совет"
      - "Используй заземление только после того, как безопасность признана и проверена"
      - "Валидируй гипербдительность и навязчивые мысли как нормальные защитные реакции"
      - "Создай пространство для гнева — на преступника, на систему, на ситуацию"
    dont_rules:
      - "Don't ask about sentimental items (jewelry, photos, gifts) unless the user brings them up first"
      - "Don't invent details not present in the user's message — no timing, location, injuries, or police involvement unless stated"
      - "Don't focus on security advice — this is emotional support, not prevention"
      - "Don't minimize with 'at least no one was hurt'"
      - "Don't say 'things can be replaced'"
      - "Don't push for police report or insurance steps immediately"
      - "Don't offer multiple techniques at once — presence first"
    contraindications: []
    escalation_rules:
      - "If robbery involved physical harm or trauma → consider Tier 2 for PTSD response"
      - "If safety remains compromised (ongoing threat) → refer to emergency services"
    knowledge_snippets:
      - "После кражи или ограбления человек переживает нарушение базового ощущения безопасности пространства — особенно при взломе жилья. Это глубже, чем просто потеря вещей."
      - "Если человек сам упоминает предметы с историей — украшения, фотографии, подарки — горе об их утрате реально и глубже денежной стоимости. Не инициируй эту тему первым."
      - "Гипербдительность, проверка замков, навязчивые мысли об инциденте — нормальные защитные реакции нервной системы. Они проходят по мере того, как восстанавливается ощущение безопасности."


version: "1.0"
scenarios:
  - id: sadness_grief
    title: "Грусть / Тоска / Утрата"
    emotion_signals:
      - грустно
      - грусть
      - тоска
      - тоскую
      - горе
      - горюю
      - утрата
      - потеря
      - плачу
      - расставание
      - развод
      - умер
      - умерла
      - скучаю
      - пусто
      - sad
      - sadness
      - grief
      - loss
      - heartbreak
      - mourning
      - miss
      - broke up
      - divorce
    risk_signals:
      - невыносимо
      - больше не могу
      - нет смысла жить
      - устал жить
      - устала жить
    risk_ceiling: 2
    recommended_techniques:
      - labeling_dbt
      - self_compassion_neff
      - behavioral_activation
      - permission_to_grieve
    response_shape: "hear → normalize → one_tool → invite_continue"
    do_rules:
      - "Acknowledge the pain before offering anything"
      - "Normalize the emotion — this is a human response, not a flaw"
      - "Offer one small, concrete, immediately actionable tool"
      - "End with a gentle open invitation, not a direct closed question"
    dont_rules:
      - "Don't minimize the pain or compare it to others"
      - "Don't rush to solutions or positivity"
      - "Don't say 'everything will be okay' or 'time heals all wounds'"
      - "Don't promise recovery or specific outcomes"
    contraindications:
      - "Avoid behavioral_activation if user signals severe hopelessness (Tier 2)"
    escalation_rules:
      - "If user mentions inability to continue living → escalate to Tier 3"


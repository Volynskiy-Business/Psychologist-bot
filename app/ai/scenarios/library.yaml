      - "Acknowledge the pain of loss — not just the breakup, but the history, the future that was planned, and the trust that was broken"
      - "When betrayal is present, validate the specific wound of being deceived — this is not ordinary sadness"
      - "Validate grief over the relationship and the future that was imagined"
      - "Normalize identity disruption — it is normal to feel lost and hollowed out after years together"
      - "Let the user tell the story without rushing to comfort or solution"
      - "Offer one self-compassion or emotion-labeling tool only after the pain is heard"
    dont_rules:
      - "Don't say 'you'll find someone better' or 'there are plenty of fish'"
      - "Don't minimize the pain even if the relationship was difficult"
      - "Don't analyze the relationship dynamics or assign blame"
      - "Don't rush to practical steps — hold the pain first"
      - "Don't push the user to 'move on' or see positives"
    contraindications:
      - "Avoid behavioral activation in acute grief — normalize and hold first"
    escalation_rules:
      - "If user expresses hopelessness about ever connecting again → escalate to Tier 2"
      - "If betrayal grief includes loss of will to live → escalate to Tier 3"


      - worry_scheduling
      - accepting_uncertainty_act
    response_shape: "hear → validate → physical_anchor → invite_continue"
    do_rules:
      - "Validate the physical reality of anxiety — it is real, not imagined"
      - "Offer a body-based technique before cognitive ones"
      - "Keep instructions short and immediately actionable"
      - "Normalize uncertainty as part of life"
    dont_rules:
      - "Don't say 'just don't worry' or 'there is nothing to be afraid of'"
      - "Don't give multiple techniques at once"
      - "Don't amplify or dramatize the anxiety"
    contraindications:
      - "Avoid worry_scheduling during acute panic — body first"
    escalation_rules:
